services:
  - type: web
    name: datamind-nl2sql
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run query_engine/app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_MODEL
        value: gemini-3.8-flash
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: HUGGINGFACE_HUB_TOKEN
        sync: false
